<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk-through room — DisplayXR camera rig</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14120f; color: #f2ece2;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }

  /* The stage is VISUALLY BARE (woven-canvas rule 7): no border, radius, shadow, opacity or filter
     on the canvas or on any ancestor. The canvas is the whole window. */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; will-change: transform; cursor: crosshair; }

  /* Opaque cover held on top of the canvas until handle.firstWoven settles (woven-canvas rule 5).
     A hard cut, never a fade. Removed by the script; pointer-events none so it never blocks input. */
  #cover { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: #14120f;
    display: flex; align-items: center; justify-content: center; color: #b9ae9c; font-size: 14px; }

  /* Controls hint. A small partial region over the tile, a translucent tint, no backdrop-filter and
     no glow outside its own box (woven-canvas rules 8 and 10). */
  #hud { position: fixed; left: 16px; bottom: 16px; z-index: 3; pointer-events: none;
    padding: 8px 12px; background: rgba(12, 11, 10, .6); color: #f2ece2; font-size: 13px;
    max-width: calc(100vw - 32px); }
  #hud b { font-weight: 600; color: #ffd9a0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cover">Preparing the room…</div>
<div id="hud" data-inline3d-overlay>
  <b>W A S D</b> walk · <b>Shift</b> run · <b>drag</b> or click + mouse to look ·
  <b>Esc</b> releases the mouse
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js"
} }
</script>
<script type="module" src="./walkthrough.js"></script>
</body>
</html>
