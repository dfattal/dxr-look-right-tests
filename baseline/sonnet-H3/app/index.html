<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Flight — DisplayXR inline 3D</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1424;
    font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  /* The canvas is VISUALLY BARE: no border, radius, shadow, filter or opacity on it or its
     ancestors (they would be woven into the side-by-side pair and halved). */
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  /* HUD: small partial regions over the canvas, plain translucent tint, no backdrop-filter. */
  .hud { position: fixed; background: rgba(8, 16, 32, 0.62); border-radius: 10px; padding: 10px 18px;
    pointer-events: none; user-select: none; }
  #score { top: 20px; left: 20px; }
  #score small { display: block; font-size: 12px; letter-spacing: .18em; opacity: .8; }
  #score b { font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #score i { font-style: normal; font-size: 16px; opacity: .8; margin-left: 6px; }
  #status { top: 20px; right: 20px; font-size: 13px; font-weight: 500; max-width: 300px; }
  #hint { bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 15px; white-space: nowrap; }
  #hint.gone, #flash { visibility: hidden; }
  #flash { top: 22%; left: 50%; transform: translateX(-50%); font-size: 30px; padding: 4px 16px; color: #ffe27a; }
  #flash.on { visibility: visible; }
  kbd { background: rgba(255,255,255,.18); border-radius: 5px; padding: 1px 7px; font: inherit; }
  /* Opaque cover on top of the canvas until the first woven frame (hard cut, never faded).
     NOT marked as an overlay. */
  #cover { position: fixed; inset: 0; background: #0b1424; display: flex; align-items: center;
    justify-content: center; font-size: 20px; letter-spacing: .08em; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="score" class="hud" data-inline3d-overlay><small>RINGS</small><b id="scoreVal">0</b><i id="missVal"></i></div>
<div id="status" class="hud" data-inline3d-overlay>Starting…</div>
<div id="flash" class="hud" data-inline3d-overlay>+1</div>
<div id="hint" class="hud" data-inline3d-overlay><kbd>←</kbd> <kbd>→</kbd> steer &nbsp; <kbd>↑</kbd> climb &nbsp; <kbd>↓</kbd> dive &nbsp; <kbd>P</kbd> pause — fly through the rings</div>
<div id="cover">LOADING…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "@displayxr/inline3d": "../../sdk/js/inline3d.js",
    "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js"
  }
}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
