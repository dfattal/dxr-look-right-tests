<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room walk-through — DisplayXR inline 3D</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14110e; color: #f1ece4;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* The woven canvas is VISUALLY BARE: no border, radius, shadow, filter or opacity on it or on
     any ancestor (woven-canvas rules 7). will-change from its first paint (rule 4). */
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
           will-change: transform; cursor: crosshair; touch-action: none; outline: none; }

  /* HUD: small, partial-rect DOM elements at the edges. DOM sits on the glass (zero disparity) at
     native panel resolution, so it stays crisp. Solid translucent tints only — never
     backdrop-filter over the weave (rule 10). Hidden with display:none, never opacity:0. */
  .hud { position: fixed; z-index: 2; background: rgba(18, 15, 12, 0.82); border: 1px solid rgba(255, 255, 255, 0.12);
         border-radius: 10px; padding: 10px 14px; pointer-events: none; }
  #help { top: 16px; left: 16px; max-width: 300px; }
  #help h1 { font-size: 15px; margin: 0 0 4px; font-weight: 650; letter-spacing: .2px; }
  #help p { margin: 0; opacity: .85; font-size: 13px; }
  #help .keys { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 6px; font-size: 13px; }
  kbd { display: inline-block; min-width: 1.4em; text-align: center; background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 0 4px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #status { bottom: 16px; left: 16px; font-size: 12px; padding: 6px 11px; }
  #status.woven { color: #8fe3ad; }
  #status.flat  { color: #e8c88a; }
  #status.warn  { color: #f5b55c; }
  #debug { bottom: 16px; right: 16px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; display: none; }
  #start { top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; padding: 14px 20px; }
  #start b { font-size: 15px; }

  /* Cover: opaque, ON TOP of the canvas, removed with a hard cut on handle.firstWoven (rule 5). */
  #cover { position: fixed; inset: 0; z-index: 3; background: #14110e; display: flex;
           align-items: center; justify-content: center; font-size: 14px; color: #b8ad9e; }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" width="1280" height="720"></canvas>

<div id="help" class="hud">
  <h1>A small furnished room</h1>
  <p>Walk around and look about.</p>
  <div class="keys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>walk · <kbd>↑</kbd><kbd>↓</kbd> walk, <kbd>←</kbd><kbd>→</kbd> turn</span>
    <span><kbd>Shift</kbd></span><span>walk faster</span>
    <span>mouse</span><span>drag to look · click to lock, <kbd>Esc</kbd> to release</span>
    <span><kbd>−</kbd> <kbd>=</kbd></span><span id="depthKeyLabel">less / more depth</span>
    <span><kbd>H</kbd></span><span>hide this</span>
  </div>
</div>
<div id="start" class="hud"><b>Click or drag to look around</b><br>then walk with W A S D</div>
<div id="status" class="hud flat">Starting…</div>
<div id="debug" class="hud"></div>
<div id="cover">Loading the room…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
