<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabletop Solar System — DisplayXR inline-3D</title>
<style>
  :root { color-scheme: dark; --bg: #05070d; }
  html, body { margin: 0; background: var(--bg); color: #e6ecf8;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: .01em; }
  .sub { margin: 0 0 14px; color: #9fb0cf; }
  /* The stage owns the dark backdrop (UNDER the canvas). The canvas itself stays visually bare:
     no border/radius/shadow/filter/opacity — the scene feathers its own edges per eye. */
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--bg); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    will-change: transform; }
  /* Opaque cover, ON TOP of the canvas until firstWoven; hard-cut, never faded. */
  #cover { position: absolute; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; color: #6f7fa0; font-size: 14px; }
  #cover[hidden] { display: none; }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 12px 0 0; }
  button { font: inherit; color: #e6ecf8; background: #1b2540; border: 1px solid #34456e;
    border-radius: 8px; padding: 6px 16px; cursor: pointer; }
  button:hover { background: #24325a; }
  label { display: flex; gap: 8px; align-items: center; color: #9fb0cf; }
  input[type=range] { width: 160px; }
  .legend { display: flex; gap: 6px 18px; flex-wrap: wrap; margin: 14px 0 0; padding: 0; list-style: none;
    color: #b9c6e0; font-size: 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #status { margin-top: 14px; font-size: 13px; color: #7e8fb0; }
  #status b { color: #4ade80; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tabletop Solar System</h1>
  <p class="sub">A sun, four planets and a moon, floating above a starfield.</p>
  <div class="stage">
    <canvas id="view"></canvas>
    <div id="cover" hidden>Preparing 3D…</div>
  </div>
  <div class="controls">
    <button id="pause" type="button">Pause</button>
    <label>Speed <input id="speed" type="range" min="0" max="4" step="0.1" value="1"></label>
  </div>
  <ul class="legend">
    <li><i style="background:#ffc247"></i>Sun</li>
    <li><i style="background:#b08a6a"></i>Ember</li>
    <li><i style="background:#4f8fe0"></i>Terra &amp; moon</li>
    <li><i style="background:#d9a15a"></i>Ringed Giant</li>
    <li><i style="background:#7fd0d0"></i>Frost</li>
  </ul>
  <div id="status"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "sdk/": "../../sdk/js/"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
