<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A small room — first-person walk-through</title>
<style>
  :root { color-scheme: dark; --bg: #2b2825; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #ece6dd;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The woven canvas: visually bare (no border/radius/shadow/filter/opacity — the weave splits
     the box down the middle), and promoted to its own layer from its very first paint. */
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
           will-change: transform; touch-action: none; cursor: crosshair; outline: none; }
  #stage.dragging { cursor: grabbing; }

  /* HUD: small plates with near-solid backgrounds, never full-bleed, never backdrop-filter. */
  .plate { position: fixed; background: rgba(30, 27, 24, 0.92); border: 1px solid rgba(255, 255, 255, 0.10);
           border-radius: 10px; padding: 10px 14px; z-index: 2; user-select: none; }
  #help { left: 16px; top: 16px; max-width: 290px; }
  #help h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  #help p { margin: 0; opacity: .8; font-size: 13px; }
  #status { right: 16px; top: 16px; font-size: 12px; padding: 6px 11px; opacity: .9; }
  #status.woven b { color: #8fdcaa; }
  #status.flat b { color: #e6c07a; }
  #hint { left: 50%; bottom: 24px; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
  kbd { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); border-radius: 4px;
        padding: 0 5px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Opaque cover over the canvas until the first woven frame (hard cut, never a fade). */
  #cover { position: fixed; inset: 0; background: var(--bg); z-index: 3; display: flex;
           align-items: center; justify-content: center; font-size: 15px; color: #cfc6b8; }
</style>
</head>
<body>
  <canvas id="stage" tabindex="0"></canvas>

  <div id="help" class="plate">
    <h1>A small room</h1>
    <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> faster ·
       mouse to look (click to capture, or drag) · <kbd>←</kbd><kbd>→</kbd> turn ·
       <kbd>Esc</kbd> release the mouse</p>
  </div>
  <div id="status" class="plate flat"><b>Starting…</b></div>
  <div id="hint" class="plate">Click the room to look around with the mouse</div>

  <div id="cover">Entering the room…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
