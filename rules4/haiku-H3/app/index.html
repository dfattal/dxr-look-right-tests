<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Flight — DisplayXR inline-3D</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #1c1e23; color: #e7e9ee;
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 20px 36px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .help { margin: 0 0 12px; opacity: .7; font-size: 14px; }
  .status { margin: 10px 0 0; font-size: 13px; opacity: .85; min-height: 1.5em; }
  .status a { color: #7fb8ff; }
  .status .ok { color: #7ee2a4; font-weight: 600; }

  /* The stage is VISUALLY BARE: no border, radius, shadow, opacity, or filter on the canvas or any
     ancestor. The weave splits the canvas's rect as a side-by-side pair, so any of those would be
     woven with it and come out lopsided. */
  .stage { position: relative; width: min(100%, 1200px, calc((100vh - 150px) * 16 / 9)); margin: 0 auto; }
  #scene { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; will-change: transform; }

  /* Cover: an opaque block over the canvas until the browser has joined it (firstWoven). A hard
     cut when it goes; display:none, never opacity. */
  .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           background: #1c1e23; color: #9aa3b2; font-size: 14px; }
  .cover[hidden] { display: none; }

  /* HUD: a small translucent chip over the tile. data-inline3d-overlay marks it for older browsers;
     it sits inside the tile and stays smaller than it. No backdrop-filter, no shadow or glow. */
  .hud { position: absolute; top: 12px; left: 12px; padding: 6px 12px; border-radius: 8px;
         background: rgba(12, 14, 18, .62); color: #fff; font: 600 14px/1.2 system-ui, sans-serif;
         letter-spacing: .08em; pointer-events: none; }
  .hud b { display: inline-block; margin-left: 8px; font-size: 24px; color: #ffc65c;
           font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .hud b.pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(1.35); } to { transform: scale(1); } }

  kbd { background: #ffffff1a; border: 1px solid #ffffff26; border-radius: 4px; padding: 0 5px;
        font: 12px ui-monospace, Menlo, monospace; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js"
} }
</script>
</head>
<body>
<div class="wrap">
  <h1>Ring Flight</h1>
  <p class="help"><kbd>←</kbd> <kbd>→</kbd> bank and turn · <kbd>↑</kbd> climb · <kbd>↓</kbd> dive · fly through the gold rings</p>

  <div class="stage">
    <canvas id="scene"></canvas>
    <div id="cover" class="cover">Starting…</div>
    <div id="hud" class="hud" data-inline3d-overlay>Rings <b id="score">0</b></div>
  </div>

  <div id="status" class="status">Starting…</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
