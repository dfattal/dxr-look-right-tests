<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk aquarium — DisplayXR inline-3D</title>
<link rel="icon" href="data:,">
<style>
  /* The page colour behind the canvas == the scene's clearColor (BG in app.js). */
  html,body{margin:0;background:#101a24;color:#e6edf3;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px}
  p{color:#a9b8c6;margin:0 0 18px}
  /* Visually bare canvas: no border/radius/shadow/filter/opacity/animated transform on it, its
     ancestors or anything over it. */
  .stage{position:relative}
  #tank{display:block;width:100%;aspect-ratio:16/9}
  /* Cover until handle.firstWoven, removed in one step (never faded). */
  #cover{position:absolute;inset:0;background:#101a24}
  /* Controls sit OUTSIDE the tile, below it. Plain colours only: no filter, blur or opacity. */
  .controls{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:18px}
  .controls label{display:flex;gap:10px;align-items:center;color:#a9b8c6}
  .controls input{width:180px}
  button{font:inherit;border-radius:8px;cursor:pointer;background:#1c2a38;color:#e6edf3;border:1px solid rgba(255,255,255,0.2);padding:6px 14px}
  #modeNote{font-size:14px;color:#8a9baa;margin:0;flex-basis:100%}
</style>
</head>
<body>
<div class="wrap">
  <h1>Desk aquarium</h1>
  <p>Five fish, a sandy floor, a few rocks and swaying plants in a glass tank. Move your head to look into it.</p>
  <div class="stage">
    <canvas id="tank"></canvas>
    <div id="cover"></div>
  </div>
  <div class="controls">
    <label>Depth <input id="depth" type="range" min="0" max="1" step="0.05" value="1"></label>
    <button id="mode" type="button">Show in 2D</button>
    <p id="modeNote"></p>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js",
  "@displayxr/inline3d/viewer": "../../sdk/js/inline3d-viewer.js"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
