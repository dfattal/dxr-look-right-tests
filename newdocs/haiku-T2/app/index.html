<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar system — DisplayXR inline-3D</title>
<link rel="icon" href="data:,">
<style>
  /* The page colour behind the canvas == the scene's clearColor (BG in app.js). */
  html,body{margin:0;background:#05070d;color:#e6e8ee;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 2px}
  .sub{color:#a9b4c8;margin:0 0 18px}
  /* Visually bare canvas: no border/radius/shadow/filter/opacity/animated transform on it, its
     ancestors or anything over it. */
  .stage{position:relative}
  #scene{display:block;width:100%;aspect-ratio:16/9}
  /* Cover until handle.firstWoven, removed in one step (never faded). */
  #cover{position:absolute;inset:0;background:#05070d}
  /* Controls sit BELOW the tile, outside it. Plain colours only: no filter, opacity or transform. */
  .controls{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
  .controls label{display:flex;gap:10px;align-items:center;color:#a9b4c8}
  .controls input{width:160px}
  button{font:inherit;border-radius:8px;cursor:pointer;background:#141b2c;color:#e6e8ee;border:1px solid #2a3652;padding:6px 14px}
  #modeNote{font-size:13px;color:#7d8aa3;margin:6px 0 0;flex-basis:100%}
</style>
</head>
<body>
<div class="wrap">
  <h1>A small solar system</h1>
  <p class="sub">A sun, four planets and a moon, turning in front of a starfield.</p>
  <div class="stage">
    <canvas id="scene"></canvas>
    <div id="cover"></div>
  </div>
  <div class="controls">
    <label>Depth <input id="depth" type="range" min="0" max="1" step="0.05" value="1"></label>
    <button id="mode" type="button">Show in 2D</button>
    <p id="modeNote"></p>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js",
  "@displayxr/inline3d/viewer": "../../sdk/js/inline3d-viewer.js"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
