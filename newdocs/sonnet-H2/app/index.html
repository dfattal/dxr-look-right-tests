<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Aquarium — DisplayXR inline-3D</title>
<link rel="icon" href="data:,">
<style>
  /* The page colour behind the tile == the scene's clearColor (BG in app.js). */
  html,body{margin:0;background:#07131f;color:#dbe8f5;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 48px}
  h1{font-size:26px;margin:0 0 2px;font-weight:600}
  .sub{color:#8fa6bd;margin:0 0 16px}
  /* Visually bare canvas: no border/radius/shadow/filter/opacity/animated transform on it, its
     ancestors or anything over it. All 2D chrome lives outside the tile. */
  .stage{position:relative}
  #tank{display:block;width:100%;aspect-ratio:16/9;background:#07131f}
  /* Cover until handle.firstWoven, removed in one step (never faded). */
  #cover{position:absolute;inset:0;background:#07131f}
  .controls{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:16px}
  .controls label{display:flex;gap:10px;align-items:center;color:#a9bdd1}
  .controls input{width:180px}
  button{font:inherit;border-radius:8px;cursor:pointer;background:#12283d;color:#dbe8f5;border:1px solid rgba(160,200,240,0.35);padding:6px 14px}
  button:disabled,input:disabled{cursor:default;color:#6f8399}
  #modeNote{font-size:13px;color:#8fa6bd;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Desk Aquarium</h1>
  <p class="sub">Five fish, swaying plants and a trickle of bubbles in a glass tank. On a 3D display the tank sits in the glass.</p>
  <div class="stage">
    <canvas id="tank"></canvas>
    <div id="cover"></div>
  </div>
  <div class="controls">
    <label>Depth <input id="depth" type="range" min="0" max="1" step="0.05" value="1"></label>
    <button id="mode" type="button">Show in 2D</button>
    <p id="modeNote"></p>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "@displayxr/inline3d": "../../sdk/js/inline3d.js",
  "@displayxr/inline3d/three": "../../sdk/js/inline3d-three.js",
  "@displayxr/inline3d/viewer": "../../sdk/js/inline3d-viewer.js"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
